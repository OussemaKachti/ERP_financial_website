<section class="pt-0">
    <div class="container">
        <div class="bg-dark position-relative rounded-4 overflow-hidden p-4 p-sm-6" data-bs-theme="dark">

            <div class="d-flex justify-content-between mb-4 mb-md-5">
                <h2>Client testimonials</h2>
                <div class="d-flex justify-content-center justify-content-sm-end gap-3 position-relative mt-3">
                    <a [routerLink]="[]"
                        class="fs-5 text-body-secondary text-primary-hover mb-0 swiper-button-prev-testimonials"><i
                            class="bi bi-arrow-left"></i></a>
                    <a [routerLink]="[]"
                        class="fs-5 text-body-secondary text-primary-hover mb-0 swiper-button-next-testimonials"><i
                            class="bi bi-arrow-right"></i></a>
                </div>
            </div>

            
            <div class="swiper mt-2 mt-md-4">
                <div class="swiper">
                    <swiper-container class="swiper-wrapper" [config]="swiperConfig" init="false">
                        @for (testimonial of testimonial; track $index) {
                        <swiper-slide class="swiper-slide">
                            <div class="row align-items-center">
                              
                                <div class="col-lg-3 text-lg-center mb-3 mb-lg-0">
                                    
                                    <div class="avatar avatar-xxl mx-auto flex-shrink-0 mb-3">
                                        <img class="avatar-img rounded-circle" [src]="testimonial.author.avatar"
                                            alt="avatar">
                                    </div>
                                    <h6 class="mb-1 lead">{{ testimonial.author.name }}</h6>
                                    <p class="mb-0 small">{{ testimonial.author.role }}</p>
                                </div>

                                <blockquote class="col-lg-9">
                                 
                                    <ul class="list-inline mb-2">
                                        @for (star of getStars(testimonial.rating); track $index) {
                                        <li class="list-inline-item lead me-0">
                                            <i class="bi"
                                                [class]="{'bi-star-fill text-warning': star === 'full', 'bi-star-half text-warning': star === 'half'}"></i>
                                        </li>
                                        }
                                    </ul>
                                    <p class="fs-5 heading-color mb-0">{{ testimonial.content }}</p>
                                </blockquote>
                            </div>
                        </swiper-slide>
                        }
                    </swiper-container>
                </div>
            </div>
        </div>
    </div>

</section>
