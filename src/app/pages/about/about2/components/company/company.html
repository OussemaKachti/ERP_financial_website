<section class="pt-9 overflow-hidden">
    <div class="container pt-6 pt-sm-8">
        <div class="row mb-md-5">

            <div class="col-sm-8 col-md-7 col-lg-5">
                <h2>A legacy of creativity and growth</h2>
            </div>

            <div class="col-sm-3 col-md-4 ms-auto">
                <div class="d-flex justify-content-end gap-2 position-relative">
                    <a  [routerLink]="[]" class="btn btn-lg btn-secondary btn-icon rounded-circle mb-0 swiper-button-prev"><i class="bi bi-arrow-left">
                        </i></a>
                    <a  [routerLink]="[]" class="btn btn-lg btn-secondary btn-icon rounded-circle mb-0 swiper-button-next"><i class="bi bi-arrow-right">
                        </i></a>
                </div>
            </div>
        </div>

        <div class="swiper swiper-step swiper-outside-end-n20" data-swiper-options='{
			}'>

            <swiper-container class="swiper-wrapper" [config]="swiperConfig" init="false">

                @for (item of companyData; track $index) {
                <swiper-slide class="swiper-slide">
                    <div class="swiper-step-divider"></div>
                    <div class="card card-body bg-secondary bg-opacity-50 p-4 me-2 me-sm-5">
                        <h6 class="text-primary">{{item.year}}</h6>
                        <p class="mb-0">{{item.description}}</p>
                    </div>
                </swiper-slide>
                }

            </swiper-container>
        </div>
    </div>
</section>
