<section class="bg-secondary-grad overflow-hidden mt-6 pt-7">
    <div class="container pb-8">
        <h5 class="mb-4">Key benefits</h5>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-4">
            @for (item of benefits; track $index) {
            <div class="col">
                <div class="card card-body h-100 rounded-3 p-4">
                    <h6 class="mb-3">{{item.title}}</h6>
                    <p class="mb-0">{{item.description}}</p>
                </div>
            </div>
            }
        </div>
        <div class="row g-4 mt-5 mt-md-7">
            <div class="col-lg-6 pe-lg-6">
                <img src="assets/images/services/01.jpg" class="rounded-4" alt="service image">
            </div>

            <div class="col-lg-6">
                <h2>What's included in web development?</h2>

                <div ngbAccordion [closeOthers]="true" class="accordion accordion-icon accordion-icon-start mt-4" id="accordionExample2">
                    @for (item of faqsData; track item.id) {
                    <div class="accordion-item mb-2" ngbAccordionItem [collapsed]="!item.open">
                        <h6 ngbAccordionHeader class="accordion-header" id="heading-{{ item.id }}">
                            <button ngbAccordionToggle class="accordion-button py-2" type="button" [attr.data-bs-target]="'#collapse-' + item.id" [attr.aria-expanded]="item.open" [attr.aria-controls]="'collapse-' + item.id" [class.collapsed]="!item.open">
                                <span class="lead fw-bold">{{ item.title }}</span>
                            </button>
                        </h6>

                        <div id="collapse-{{ item.id }}" ngbAccordionCollapse class="accordion-collapse collapse" [class.show]="item.open" [attr.aria-labelledby]="'heading-' + item.id" data-bs-parent="#accordionExample2">
                            <div class="accordion-body" ngbAccordionBody>
                                {{ item.content }}
                            </div>
                        </div>
                    </div>
                    }
                </div>
            </div>

        </div>

        <div class="inner-container text-center mt-7">
            <h4>Technologies used</h4>
            <ul class="list-inline d-flex justify-content-center flex-wrap gap-4 mt-4">

                @for(item of technologicon;track $index){
                <li class="list-inline-item me-0">
                    <a  [routerLink]="[]" class="icon-xl btn-transition bg-body d-flex justify-content-center align-items-center rounded-2">
                        <img [src]="item" class="h-40px" alt="icon">
                    </a>
                </li>
            }
            </ul>
        </div>
    </div>
</section>
