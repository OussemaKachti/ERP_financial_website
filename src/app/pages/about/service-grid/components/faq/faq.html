<section class="pt-0">
    <div class="container">
        <div class="row">
            <div class="col-md-6 position-relative">
                <div class="position-absolute top-0 start-0 ms-xl-5">
                    <img src="assets/images/elements/rocket-02.png" class="h-150px rotate-335" alt="rocket image">
                </div>

                <div class="row ps-xl-7">
                    <div class="col-sm-8">
                        <img src="assets/images/about/13.jpg" class="rounded-pill" alt="image">
                    </div>
                    <div class="col-sm-4 col-md-8 col-lg-5 mt-auto ms-lg-n5 mb-5">
                        <div class="card shadow rounded text-center p-0">

                            <div class="card-body p-3">
                                <h6 class="h1">4.8</h6>
                                <ul class="list-inline d-flex justify-content-center gap-2 mb-1">
                                    <li class="list-inline-item me-0"><i class="bi bi-star-fill text-warning"></i></li>
                                    <li class="list-inline-item me-0"><i class="bi bi-star-fill text-warning"></i></li>
                                    <li class="list-inline-item me-0"><i class="bi bi-star-fill text-warning"></i></li>
                                    <li class="list-inline-item me-0"><i class="bi bi-star-fill text-warning"></i></li>
                                    <li class="list-inline-item me-0"><i class="bi bi-star-half text-warning"></i></li>
                                </ul>
                                <span>2855 Reviews</span>
                            </div>

                            <div class="card-footer bg-dark p-3">
                                <img src="assets/images/elements/trustpilot-light.svg" class="h-30px" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-5 ms-auto mt-5 mt-md-0">
                <h2>Why choose us?</h2>
                <div ngbAccordion [closeOthers]="true" class="accordion accordion-icon accordion-border-bottom mt-5" id="accordionFaq">
                    @for (item of accordionItems; track item.id) {
                    <div class="accordion-item mb-3" ngbAccordionItem [collapsed]="!item.open">
                        <div class="accordion-header font-base" ngbAccordionHeader id="heading-{{ item.id }}">
                            <button ngbAccordionButton class="accordion-button fw-semibold rounded collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse-' + item.id" [attr.aria-expanded]="item.open" [attr.aria-controls]="'collapse-' + item.id">
                                <span class="lead">{{ item.title }}</span>
                            </button>
                        </div>

                        <div id="collapse-{{ item.id }}" ngbAccordionCollapse class="accordion-collapse collapse" [class.show]="item.open" [attr.aria-labelledby]="'heading-' + item.id" data-bs-parent="#accordionFaq">
                            <div class="accordion-body pb-0" ngbAccordionBody>
                                {{ item.content }}
                            </div>
                        </div>
                    </div>
                    }
                </div>

            </div>
        </div>
    </div>
</section>
