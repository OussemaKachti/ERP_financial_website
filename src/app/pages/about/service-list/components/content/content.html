
<section class="py-0">
	<div class="container">
		<div class="row align-items-center align-items-xl-end">
			
			<div class="col-md-5 mb-9 mb-md-0">
				<h2 class="mb-4">Integrate with a wide range of <span class="text-primary">projects</span></h2>
				<p class="mb-3">Our integration solutions facilitate smooth collaboration and help you achieve project goals efficiently.</p>
				
				<ul class="list-group list-group-borderless mb-4">
					@for(item of contentData;track $index){
					<li class="list-group-item heading-color d-flex pb-0"><i class="bi bi-patch-check text-success me-2"></i>{{item}}</li>
					}
				</ul>
				
				<a class="btn btn-dark icon-link icon-link-hover" routerLink="/portfolio-modern">Explore our work<i class="bi bi-arrow-right"></i> </a>
			</div>
			

			
			<div class="col-md-6 ms-auto">
				<div class="bg-secondary bg-opacity-50 rounded-4">
					<img src="assets/images/elements/service-2.png" class="mt-n8" alt="image">
				</div>
			</div>
		</div>
	</div>
</section>
