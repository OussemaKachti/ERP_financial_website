<section class="position-relative overflow-hidden">
    <div class="position-absolute start-0 bottom-0 mb-n7 ms-n7 d-none d-md-block">
        <img src="assets/images/elements/grad-shape/05.png" class="h-md-300px h-xl-400px h-xxl-500px" alt="grad shape">
    </div>

    <div class="container position-relative">
        <div class="row g-4">


            <div class="col-md-4">
                <h2 class="mb-3">Frequently Asked Questions</h2>
                <p class="mb-0">Our team is ready to assist you! Start a chat for quick support. <a  [routerLink]="[]" class="hover-underline-animation fw-semibold">Talk to Us</a></p>
            </div>

            <div class="col-md-7 ms-auto">
                <div class="accordion accordion-icon accordion-border-bottom" [closeOthers]="true" ngbAccordion id="accordionFaq">
                    @for (faq of faqList; track faq.id) {
                    <div class="accordion-item mb-3" ngbAccordionItem [collapsed]="!faq.open">
                        <div class="accordion-header font-base" ngbAccordionHeader id="heading-{{ faq.id }}">
                            <button ngbAccordionButton class="accordion-button fw-semibold rounded collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse-' + faq.id" [attr.aria-expanded]="faq.open ? 'true' : 'false'" [attr.aria-controls]="'collapse-' + faq.id">
                                <span class="lead heading-color">{{ faq.question }}</span>
                            </button>
                        </div>

                        <div id="collapse-{{ faq.id }}" ngbAccordionCollapse class="accordion-collapse collapse" [class.show]="faq.open" [attr.aria-labelledby]="'heading-' + faq.id" data-bs-parent="#accordionFaq">
                            <div class="accordion-body pb-0" ngbAccordionBody>
                                {{ faq.answer }}
                            </div>
                        </div>
                    </div>
                    }
                </div>



            </div>

        </div>
    </div>
</section>
