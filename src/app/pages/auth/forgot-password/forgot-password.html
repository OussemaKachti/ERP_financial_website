<main>
    <section class="bg-secondary position-relative vh-100">
        <div class="container h-100 d-flex flex-column justify-content-center">
            <div class="row justify-content-center align-items-center">

                <div class="col-sm-10 col-md-8 col-lg-7 col-xl-6 col-xxl-5 position-relative">

                    <div class="vert-move position-absolute top-0 start-0 ms-n5 mt-n5 z-index-9 d-none d-sm-block">
                        <img src="assets/images/elements/ufo.png" class="h-100px rotate-343" alt="ufo image">
                    </div>

                    <div class="position-absolute bottom-0 end-0 mb-n8 me-n5 d-none d-sm-block">
                        <img src="assets/images/elements/grad-shape/blur-decoration.svg" class="blur-8 opacity-2" alt="Grad shape">
                    </div>

                    <div class="card card-body bg-body bg-opacity-25 bg-blur border border-white border-opacity-10 position-relative rounded-4 shadow-primary text-center p-4 p-sm-5">

                        <h1 class="mb-2 h3 fw-bold">Forgot password</h1>
                        <p class="mb-0">Enter the email address associated with an account.</p>

                        <form class="mt-2 mt-sm-4">

                            <div class="mb-3">
                                <input type="email" [(ngModel)]="email" name="email" [class]="{
                                  'is-invalid': !email && submit,
                                }" class="form-control" placeholder="Enter email">

                                <div class="invalid-feedback">Please provide email address.</div>
                            </div>


                            <div class="d-grid mb-2"><button (click)="emailSubmit()" type="submit" class="btn btn-primary">Reset
                                    password</button></div>

                            <div class="mb-4 text-center">
                                <a routerLink="/auth/sign-in" class="text-primary-hover"><i class="bi bi-arrow-left"></i> Back
                                    to login</a>
                            </div>


                            <div class="text-body small mt-3"> Copyrights ©{{currentYear}} Folio. Build by <a href="https://www.webestica.com/" target="_blank" class="text-body text-primary-hover hover-underline-animation">Webestica</a>. </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
