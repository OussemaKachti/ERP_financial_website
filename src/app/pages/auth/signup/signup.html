<main>
	<section class="bg-secondary position-relative vh-100">
		<div class="container h-100 d-flex flex-column justify-content-center">
			<div class="row justify-content-center align-items-center">

				<div class="col-sm-10 col-md-8 col-lg-7 col-xl-6 col-xxl-5 position-relative">

					<div class="vert-move position-absolute top-0 start-0 ms-n5 mt-n5 z-index-9 d-none d-sm-block">
						<img src="assets/images/elements/ufo.png" class="h-100px rotate-343" alt="ufo image">
					</div>

					<div class="position-absolute bottom-0 end-0 mb-n8 me-n5 d-none d-sm-block">
						<img src="assets/images/elements/grad-shape/blur-decoration.svg" class="blur-8 opacity-2" alt="Grad shape">
					</div>


					<div class="card card-body bg-body bg-opacity-25 bg-blur border border-white border-opacity-10 position-relative rounded-4 shadow-primary text-center p-4 p-sm-5">

						<h1 class="mb-2 h3 fw-bold">Create Account</h1>
						<p class="mb-0">Already have an account?<a routerLink="/auth/sign-in" class="text-primary-grad"> Sign
								in here</a></p>

						<form class="mt-2 mt-sm-4" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
							<div class="mb-3">
								<input type="text" formControlName="name" class="form-control" placeholder="Enter your name" [class.is-invalid]="isInvalid('name')" />
								<div class="invalid-feedback">Name is required (min 3 chars).</div>
							</div>
							<div class="mb-3">
								<input type="email" formControlName="email" class="form-control" placeholder="Enter email" [class.is-invalid]="isInvalid('email')" />
								<div class="invalid-feedback">Please provide a valid email address.</div>
							</div>
							<div class="mb-3 position-relative">
								<input formControlName="password" [type]="fieldTextType ? 'text' : 'password'" class="form-control fakepassword pe-6" placeholder="Enter your password" [class.is-invalid]="isInvalid('password')" />
								<span class="position-absolute top-50 end-0 translate-middle-y p-0 me-2" (click)="fieldTextType = !fieldTextType">
									<i class="fakepasswordicon bi" [class]="fieldTextType ? 'bi-eye-fill' : 'bi-eye-slash-fill'"></i>
								</span>

								<div class="invalid-feedback">
									Password is required (min 6 chars).
								</div>
							</div>

							<div class="mb-3 text-start form-check">
								<input type="checkbox" id="exampleCheck1" formControlName="terms" class="form-check-input border" [class.is-invalid]="isInvalid('terms')" />
								<label class=" small" for="exampleCheck1">
									I agree to all Terms & conditions and the privacy policy.
								</label>
								<div class="invalid-feedback">You must agree before submitting.</div>
							</div>


							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Create an account</button>
							</div>

							<div class="d-flex align-items-center my-3">
								<hr class="w-100" />
								<p class="small px-4 mb-0">Or</p>
								<hr class="w-100" />
							</div>

							<div class="d-flex justify-content-center gap-3">
								<a class="btn btn-icon bg-facebook"  [routerLink]="[]"><i class="bi bi-facebook lh-base"></i></a>
								<a class="btn btn-icon border bg-white"  [routerLink]="[]"><i class="bi bi-google lh-base text-google-icon"></i></a>
							</div>

							<div class="text-body small mt-3">
								Copyrights ©{{ currentYear }} Folio. Build by
								<a href="https://www.webestica.com/" target="_blank" class="text-body text-primary-hover hover-underline-animation">Webestica</a>.
							</div>
						</form>

					</div>
				</div>
			</div>
		</div>
	</section>
</main>
