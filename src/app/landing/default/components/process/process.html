<section class="bg-dark position-relative overflow-hidden pt-0 pt-sm-5">
	<div class="position-absolute bottom-0 end-0 mb-n8">
		<img src="assets/images/elements/grad-shape/blur-decoration-2.svg" class="opacity-2 blur-9" alt="Grad shape">
	</div>
	<span class="position-absolute top-0 start-0">
		<svg class="text-secondary rtl-flip" width="1920" height="197" viewBox="0 0 1920 197" fill="none" xmlns="http://www.w3.org/2000/svg">
			<path d="M0 0H1920V5.5L0 197V0Z" fill="currentColor" />
		</svg>
	</span>
	<div class="container position-relative pt-lg-8 pt-xl-0" data-bs-theme="dark">
		<div class="row align-items-end align-items-xxl-center">
			<div class="col-md-9 col-lg-6 mx-auto pe-xl-7">
				<img src="assets/images/about/01.jpg" class="rounded-4" alt="process image">
			</div>
			<div class="col-lg-6 mt-5 mt-xl-7">
				<span class="text-primary lead">Our process</span>
				<h2 class="mt-3 mb-4">Streamline your path to success</h2>
				<div ngbAccordion #acc="ngbAccordion" class="accordion accordion-step-border" [closeOthers]="true">
					@for (item of faqsData; track item.id) {
					<div ngbAccordionItem [id]="'accordion-' + item.id" class="accordion-item">
						<h2 ngbAccordionHeader class="accordion-header font-base">
							<button ngbAccordionButton class="accordion-button fs-6" type="button">
								<span class="accordion-step-number">
									{{ item.id }}
								</span>
								{{ item.title }}
							</button>
						</h2>
						<div ngbAccordionCollapse>
							<div ngbAccordionBody class="accordion-body pt-0">
								{{ item.description }}
							</div>
						</div>
					</div>
					}
				</div>


			</div>
		</div>


		<div class="row g-4 mt-5 mt-sm-6 mt-md-8">
			@for(item of countersData; track $index) {
			<div class="col-sm-6 col-md-3">
				<div class="d-flex h-100 pe-xl-4">
					<div>
						<div class="d-flex mb-2 mb-sm-6">
							@if(item.prefix) {
							<span class="h1 mb-0">{{ item.prefix }}</span>
							}
							<h4 class="purecounter h1 mb-0" data-purecounter-start="0" [countUp]="item.count" data-purecounter-delay="300">0</h4>
							<span class="h1 mb-0" [class]="item.color">{{ item.suffix }}</span>
						</div>
						<p class="lead">{{ item.text }}</p>
					</div>

					@if(item.divider) {
					<div class="vr bg-white bg-opacity-25 ms-auto d-none d-sm-block"></div>
					}
				</div>
			</div>
			}
		</div>

	</div>
</section>
