<section class="py-0">
    <div class="container position-relative">
        <div class="row">
            <div class="col-md-10 mx-auto">
                <div class="swiper mt-2 mt-md-4">
                    <swiper-container class="swiper-wrapper" [config]="swiperTesti" init="false">
                        @for (testimonial of testimonial; track $index) {
                        <swiper-slide class="swiper-slide">
                            <div class="row align-items-center">
                                <div class="col-lg-3 text-lg-center mb-3 mb-lg-0">
                                    <div class="avatar avatar-xxl mx-auto flex-shrink-0 mb-3">
                                        <img class="avatar-img rounded-circle" [src]="testimonial.avatar"
                                            [alt]="testimonial.name">
                                    </div>
                                    <h6 class="mb-1">{{ testimonial.name }}</h6>
                                    <span>{{ testimonial.position }}</span>
                                </div>
                                <blockquote class="col-lg-9">
                                    <ul class="list-inline mb-2">
                                        @for (star of testimonial.stars; track $index) {
                                        <li class="list-inline-item lead me-0"><i
                                                class="bi bi-star-fill text-warning"></i></li>
                                        }
                                        @if(testimonial.halfStar){
                                        <li class="list-inline-item lead me-0"><i
                                                class="bi bi-star-half text-warning"></i></li>
                                        }
                                    </ul>
                                    <p class="fs-5 heading-color">{{ testimonial.content }}</p>
                                </blockquote>
                            </div>
                        </swiper-slide>
                        }
                    </swiper-container>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between position-absolute top-50 start-0 w-100">
            <a  [routerLink]="[]"
                class="btn btn-secondary btn-icon btn-lg rounded-circle mb-0 swiper-button-prev ms-2"><i
                    class="bi bi-arrow-left text-primary-grad"></i></a>
            <a  [routerLink]="[]"
                class="btn btn-secondary btn-icon btn-lg rounded-circle mb-0 swiper-button-next me-2"><i
                    class="bi bi-arrow-right text-primary-grad"></i></a>
        </div>
    </div>
</section>
