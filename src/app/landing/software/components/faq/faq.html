<section class="bg-secondary pt-0 position-relative">
	<div class="position-absolute end-0 bottom-0 d-none d-sm-block">
		<img src="assets/images/elements/grad-shape/12.png" class="blur-2" alt="Decoration shape">
	</div>

	<div class="container position-relative">
		<div class="inner-container position-relative text-center mb-4 mb-md-5">
			<h2 class="mb-0">Got questions? (FAQs)</h2>
		</div>

		<div class="row">
			<div class="col-lg-8 mx-auto">
				<div ngbAccordion #acc="ngbAccordion" class="accordion accordion-bg-body-light" [closeOthers]="true">
					@for (item of faqsData; track item.id) {
					<div ngbAccordionItem [id]="'accordion-' + item.id" class="accordion-item mb-4">
						<h2 ngbAccordionHeader class="accordion-header font-base" [id]="'heading-' + item.id">
							<button ngbAccordionButton class="accordion-button fw-semibold rounded" type="button">
								{{ item.title }}
							</button>
						</h2>
						<div ngbAccordionCollapse>
							<div ngbAccordionBody class="accordion-body pt-0">
								{{ item.description }}
							</div>
						</div>
					</div>
					}
				</div>

				<p class="heading-color text-center">Confused? Our team is ready to assist you! Start a chat for quick support. <a  [routerLink]="[]" class="hover-underline-animation fw-semibold">Talk to Us</a></p>
			</div>
		</div>
	</div>
</section>
