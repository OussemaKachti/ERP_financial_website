<section class="pt-5 pt-xl-7">
	<div class="container">
		<div class="row g-4">
			<div class="col-lg-5">
				<h2 class="mb-4">Trusted by industry leaders</h2>
				<p class="mb-2">3000+ Users rated us <span class="text-warning fw-bold">4.85</span> out of 5.</p>
				<ul class="avatar-group mb-sm-0">
					@for (avatar of avatars; track $index) {
					<li class="avatar avatar-sm">
						<img class="avatar-img rounded-circle" [src]="avatar.src" [alt]="avatar.alt" />
					</li>
					}
				</ul>

			</div>

			<div class="col-lg-7">
				<div class="row row-cols-2 row-cols-sm-auto g-3">
					@for (client of clients; track $index) {
					<div class="col">
						<div class="bg-secondary bg-opacity-50 rounded-3 p-3">
							<img [src]="client.dark" class="light-mode-item h-30px" alt="client logo" />
							<img [src]="client.light" class="dark-mode-item h-30px" alt="client logo" />
						</div>
					</div>
					}
				</div>
			</div>

		</div>
	</div>
</section>
