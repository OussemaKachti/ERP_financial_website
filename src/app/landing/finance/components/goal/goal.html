<section class="position-relative z-index-2 pt-0">
	<div class="container">
		<div class="row">
			<div class="col-lg-6 col-xl-5 pt-5 pt-xl-7 order-2">
				<h5 class="mb-4 mb-xl-5">Achieving financial excellence together</h5>

				<div class="row g-4">
					<div class="col-md-6">
						<h6 class="mb-2"><i class="bi bi-lightning-charge-fill text-success me-2"></i>Our mission</h6>
						<p class="mb-0">We deliver exceptional financial consulting services tailored to your unique needs.</p>
					</div>
					<div class="col-md-6">
						<h6 class="mb-2"><i class="bi bi-bullseye text-warning me-2"></i>Our goal</h6>
						<p class="mb-0">We aim to help you grow and protect your wealth, ensuring a secure.</p>
					</div>
				</div>
			</div>
			<div class="col-lg-6 col-xl-5 ms-auto mt-n6 mt-lg-n9 order-1 order-lg-2">
				<div class="card bg-dark rounded-4 mt-lg-n9" data-bs-theme="dark">
					<div class="card-header bg-transparent pt-4">
						<h5 class="text-center">Book a consultant</h5>
					</div>

					<div class="card-body p-4 pt-0">
						<form class="row form-border-transparent g-4">
							<div class="col-md-6">
								<label class="form-label">First name</label>
								<input type="text" class="form-control bg-secondary" required>
							</div>

							<div class="col-md-6">
								<label class="form-label">Last name</label>
								<input type="text" class="form-control bg-secondary" required>
							</div>

							<div class="col-md-6">
								<label class="form-label">Email address</label>
								<input type="email" class="form-control bg-secondary" required>
							</div>

							<div class="col-md-6">
								<label class="form-label">Mobile number</label>
								<input type="text" class="form-control bg-secondary" pattern="\d{10}" title="Please enter a 10-digit mobile number" maxlength="10" required>
							</div>

							<div class="col-12">
								<label class="form-label">Subject</label>
								<input type="text" class="form-control bg-secondary" required>
							</div>

							<div class="col-12">
								<label class="form-label">Message</label>
								<textarea class="form-control bg-secondary" id="floatingTextarea2" style="height: 100px" required></textarea>
							</div>

							<div class="col-12 mt-4">
								<button class="btn btn-white mb-2 mb-md-0">Send a message</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
