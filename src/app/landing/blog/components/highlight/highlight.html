<section class="bg-secondary overflow-hidden pt-9">
    <div class="container pt-5 pt-xl-8">
        <div class="row">
            <div class="col-sm-8 col-lg-5">
                <h3 class="mb-0 text-center text-sm-start">Last week top highlights</h3>
            </div>
            <div class="col-sm-4 col-lg-5 ms-auto">
                <div class="d-flex justify-content-center justify-content-sm-end gap-3 position-relative mt-3">
                    <a  [routerLink]="[]"
                        class="btn btn-outline-primary btn-lg btn-icon rounded-circle mb-0 swiper-button-prev-blog rtl-flip"><i
                            class="bi bi-arrow-left"></i></a>
                    <a  [routerLink]="[]"
                        class="btn btn-outline-primary btn-lg btn-icon rounded-circle mb-0 swiper-button-next-blog rtl-flip"><i
                            class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
        <div class="swiper" >
            <swiper-container [config]="swiperConfig" init="false" class="swiper-wrapper">
                @for (blog of highlight; track $index) {
                <swiper-slide class="swiper-slide py-4">
                    <article class="card card-hover-shadow rounded-4 overflow-hidden h-100">
                        @if(blog.category){
                        <div class="badge text-bg-white position-absolute top-0 start-0 m-4">{{
                            blog.category }}</div>
                        }@if (blog.image) {
                        <div>
                            <img [src]="blog.image" class="card-img-top" alt="Blog-img">
                        </div>
                        }@if(blog.video){
                        <div class="card-img-top overflow-hidden position-relative">
                            <div class="ratio ratio-16x9">
                                <iframe [src]="blog.video | safe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                            </div>
                        </div>
                        }
                        <div class="card-body pb-2">
                            <h6 class="card-title"><a  [routerLink]="[]">{{ blog.title }}</a></h6>
                        </div>
                        <div class="card-footer pt-0">
                            <a class="icon-link icon-link-hover stretched-link" [routerLink]="blog.link">Read more<i
                                    class="bi bi-arrow-right"></i></a>
                        </div>
                    </article>
                </swiper-slide>
                }
            </swiper-container>
        </div>
    </div>
</section>
