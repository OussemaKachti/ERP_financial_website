<section class="position-relative z-index-2 py-0 mb-n9">
    <div class="container-fluid position-relative">
        <div class="max-width-1550 bg-dark position-relative rounded-4 overflow-hidden py-6 py-lg-8">
            <div class="position-absolute top-100 start-50 translate-middle">
                <img [src]="gradBlurImage" class="opacity-2 blur-9" alt="Grad shape">
            </div>
            <div class="container position-relative" data-bs-theme="dark">
                <div class="row g-4 align-items-center mb-5 mb-lg-6">
                    <div class="col-lg-7 col-xl-5">
                        <h2 class="mb-0">{{ title }}</h2>
                    </div>
                    <div class="col-lg-5 ms-auto text-lg-end">
                        <a  [routerLink]="[]" class="btn btn-white mb-0">
                            <i class="bi bi-google text-google-icon me-2"></i>{{ buttonText }}
                        </a>
                    </div>
                </div>
                <div class="row justify-content-center g-4 g-xl-6">
                    @for (step of steps;track $index) {
                    <div class="col-md-6 col-lg-4">
                        <div class="card bg-transparent p-0">
                            <div
                                class="bg-white bg-opacity-10 rounded-4 h-200px h-sm-300px overflow-hidden p-4 mb-2 mb-sm-3">
                                @if(step.image2){
                                <ng-container>
                                    <img [src]="step.image" class="mt-n5 rounded-3" alt="step image">
                                    <img [src]="step.image2" class="ms-auto d-flex me-n6 mt-n5 rounded-3"
                                        alt="step image">
                                </ng-container>
                                }@else {
                                <img [src]="step.image" class="d-flex m-auto" alt="step image">

                                }
                            </div>
                            <div class="card-body bg-transparent px-0">
                                <h6>{{ step.title }}</h6>
                                <p class="mb-0">{{ step.description }}</p>
                            </div>
                        </div>
                    </div>
                    }
                </div>
                <div class="bg-body shadow-primary rounded d-inline-block py-3 px-md-4 mt-4">
                    <p class="heading-color mb-0 px-3 px-sm-5 px-md-0">
                        <i class="bi bi-info-square-fill me-2"></i>{{ ctaText }}
                        <a [routerLink]="ctaLink" class="fw-semibold icon-link icon-link-hover hover-underline-animation">
                            {{ ctaButtonText }} <i class="bi bi-arrow-right"></i>
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
