<section class="pt-0">
    <div class="container">
        <div class="row align-items-xl-center">
            <div class="col-lg-6 position-relative order-2 pe-xl-7">

                <img src="assets/images/about/14.jpg" class="rounded-4" alt="feature image">


                <img src="assets/images/elements/chat-msg.svg" class="position-absolute top-0 start-50 translate-middle ms-n9 mt-n5 rotate-13 d-none d-sm-block" alt="">
            </div>

            <div class="col-lg-6 ms-auto order-1 order-lg-2 mb-4 mb-sm-6 mb-lg-0">

                <h4 class="mb-0">"AI chatbots innovate conversations with insights from extensive knowledge
                    repositories"</h4>

                <div class="mt-4">
                    <p class="lead heading-color fw-semibold mb-0">Jacqueline Miller</p>
                    <span>CEO & Founder</span>
                </div>
                <hr class="my-4 border-primary opacity-2">


                <div class="row row-cols-2 row-cols-md-3 g-3 g-sm-4">
                    @for (stat of featuresStats; track $index) {
                    <div class="col">
                        <h2 class="mb-0">
                            <span [countUp]="stat.value"></span>
                            @if (stat.suffix) {
                            <span class="ms-1" [class]="stat.color">{{ stat.suffix }}</span>
                            }
                        </h2>
                        <p class="mb-0">{{ stat.text }}</p>
                    </div>
                    }
                </div>

            </div>
        </div>
    </div>
</section>
