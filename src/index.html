<!doctype html>
<html lang="fr" data-bs-theme="light">

<head>
  <meta charset="utf-8">
  <title>RFIDIA — Facturation, CRM terrain et paie pour les PME</title>
  <meta name="description" content="RFIDIA réunit la gestion commerciale et la comptabilité, la prospection terrain et les ressources humaines des PME de Tunisie et d’Algérie sur une seule plateforme.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1540">
  <meta property="og:type" content="website">
  <meta property="og:title" content="RFIDIA — Votre gestion, vos clients et vos équipes sur une seule plateforme">
  <meta property="og:description" content="Facturation, stock, comptabilité, prospection terrain et paie pour les PME de Tunisie et d’Algérie.">
  <meta property="og:image" content="/assets/rfidia/screens/f-dashboard.webp">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/rfidia/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Readex+Pro:wght@300..700&display=swap"
    rel="stylesheet">
  <script>
    // Thème appliqué avant le premier rendu, pour éviter un flash clair/sombre
    (function () {
      try {
        var t = localStorage.getItem('rfidia-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Activez JavaScript pour afficher ce site.</noscript>
</body>

</html>
